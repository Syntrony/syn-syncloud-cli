name: Release Syncloud CLI

on:
  pull_request:
    types: [closed]
    branches:
      - qa
      - master
    
jobs:
  release:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions: 
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkoud@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Determine next Version env
        id: next_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.SYNCLOUD_GITHUB_TK }}
          release_branches: master
          pre_release_branches: qa

      - name: Create Git Tag
        run: |
          git tag ${{ steps.next_version.outputs.new_tag }}
          git push origin ${{ steps.next_version.outputs.new_tag }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.SYNCLOUD_GITHUB_TK }}
